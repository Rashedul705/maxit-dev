[variables]
PUPPETEER_SKIP_DOWNLOAD = "true"
NODE_OPTIONS = "--max-old-space-size=2048"
NEXT_TELEMETRY_DISABLED = "1"

[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = ["npm install --include=dev --no-audit --no-fund"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm run start"
